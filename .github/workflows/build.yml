name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  merge_group:
    types: [checks_requested]
  pull_request:
  push:
    branches: ["**"]
  workflow_call:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug
      environment:
        description: Deployment environment to run under
        type: string
  workflow_dispatch:
    inputs:
      build-type:
        description: Type of build (Debug or Release)
        type: string
        default: Debug

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})

    environment: ${{ inputs.environment || '' }}

    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.10.2

          - os: ubuntu-24.04-arm
            artifact-name: Linux-aarch64
            cmake-preset: linux
            qt-version: 6.10.2

          - os: windows-2022
            artifact-name: Windows-MinGW-w64
            cmake-preset: windows_mingw
            msystem: CLANG64
            vcvars-arch: amd64_x86

          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            # TODO(@getchoo): This is the default in setup-dependencies/windows. Why isn't it working?!?!
            vcvars-arch: amd64
            qt-version: 6.10.2

          - os: windows-11-arm
            artifact-name: Windows-MSVC-arm64
            cmake-preset: windows_msvc
            vcvars-arch: arm64
            qt-version: 6.10.2

          - os: macos-26
            artifact-name: macOS
            cmake-preset: macos_universal
            macosx-deployment-target: 12.0
            qt-version: 6.9.3

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: ${{ matrix.msystem != '' && 'msys2 {0}' || 'bash' }}

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Debug' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      ##
      # SETUP
      ##

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      ##
      # BUILD
      ##

      - name: Configure project
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

      - name: Run build
        run: |
          cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      ##
      # PACKAGE
      ##

      - name: Get short version
        id: short-version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}

          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-private-key-id: ${{ secrets.GPG_PRIVATE_KEY_ID }}

      - name: Package (macOS)
        if: ${{ runner.os == 'macOS' }}
        uses: ./.github/actions/package/macos
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}

          apple-codesign-cert: ${{ secrets.APPLE_CODESIGN_CERT }}
          apple-codesign-password: ${{ secrets.APPLE_CODESIGN_PASSWORD }}
          apple-codesign-id: ${{ secrets.APPLE_CODESIGN_ID }}
          apple-notarize-apple-id: ${{ secrets.APPLE_NOTARIZE_APPLE_ID }}
          apple-notarize-team-id: ${{ secrets.APPLE_NOTARIZE_TEAM_ID }}
          apple-notarize-password: ${{ secrets.APPLE_NOTARIZE_PASSWORD }}
          sparkle-ed25519-key: ${{ secrets.SPARKLE_ED25519_KEY }}

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        env:
          CI_HAS_ACCESS_TO_AZURE: ${{ vars.CI_HAS_ACCESS_TO_AZURE || '' }}
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          msystem: ${{ matrix.msystem }}

          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  upload_release:
    name: Upload to GitHub Release
    needs: build
    if: ${{ github.ref_type != 'tag' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: write

    runs-on: ubuntu-slim

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Determine tag and version
        id: tag
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            TAG="build-pr-${{ github.event.pull_request.number }}-${VERSION}"
            NAME="Vinilauncher build ${VERSION} (PR #${{ github.event.pull_request.number }})"
          else
            TAG="build-${VERSION}"
            NAME="Vinilauncher build ${VERSION} (${{ github.ref_name }})"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Package artifacts properly
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e

          mv Vinilauncher-Linux-Qt6-Portable-*/Vinilauncher-portable.tar.gz Vinilauncher-Linux-Qt6-Portable-${VERSION}.tar.gz
          mv Vinilauncher-Linux-aarch64-Qt6-Portable-*/Vinilauncher-portable.tar.gz Vinilauncher-Linux-aarch64-Qt6-Portable-${VERSION}.tar.gz
          mv Vinilauncher-Linux-*-x86_64.AppImage/Vinilauncher-Linux-*-x86_64.AppImage Vinilauncher-Linux-x86_64.AppImage
          mv Vinilauncher-Linux-*-x86_64.AppImage.zsync/Vinilauncher-Linux-*-x86_64.AppImage.zsync Vinilauncher-Linux-x86_64.AppImage.zsync
          mv Vinilauncher-Linux-*-aarch64.AppImage/Vinilauncher-Linux-*-aarch64.AppImage Vinilauncher-Linux-aarch64.AppImage
          mv Vinilauncher-Linux-*-aarch64.AppImage.zsync/Vinilauncher-Linux-*-aarch64.AppImage.zsync Vinilauncher-Linux-aarch64.AppImage.zsync
          mv Vinilauncher-macOS-*/Vinilauncher.zip Vinilauncher-macOS-${VERSION}.zip
          mv Vinilauncher-macOS-*/Vinilauncher.dmg Vinilauncher-macOS-${VERSION}.dmg

          for d in Vinilauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Vinilauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Vinilauncher-*.exe ../${NAME}-Setup-${VERSION}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${VERSION}.zip" *
            cd ..
          done

          for d in Vinilauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="Vinilauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv Vinilauncher-*.exe ../${NAME}-Setup-${VERSION}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${VERSION}.zip" *
            cd ..
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            Vinilauncher-Linux-x86_64.AppImage
            Vinilauncher-Linux-x86_64.AppImage.zsync
            Vinilauncher-Linux-aarch64.AppImage
            Vinilauncher-Linux-aarch64.AppImage.zsync
            Vinilauncher-Linux-Qt6-Portable-${{ steps.tag.outputs.version }}.tar.gz
            Vinilauncher-Linux-aarch64-Qt6-Portable-${{ steps.tag.outputs.version }}.tar.gz
            Vinilauncher-Windows-MinGW-w64-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MinGW-w64-Portable-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MinGW-w64-Setup-${{ steps.tag.outputs.version }}.exe
            Vinilauncher-Windows-MSVC-arm64-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MSVC-arm64-Portable-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MSVC-arm64-Setup-${{ steps.tag.outputs.version }}.exe
            Vinilauncher-Windows-MSVC-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MSVC-Portable-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-Windows-MSVC-Setup-${{ steps.tag.outputs.version }}.exe
            Vinilauncher-macOS-${{ steps.tag.outputs.version }}.zip
            Vinilauncher-macOS-${{ steps.tag.outputs.version }}.dmg
